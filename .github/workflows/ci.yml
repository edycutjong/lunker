name: CI

# Stage 1 · Quality        format + lint + 239 tests, on every supported Node
# Stage 1 · Types          tsc --noEmit for the Worker and for the Expo app
# Stage 2 · Determinism    the content seed, the telemetry fixture, the bench output
# Stage 3 · Readiness      unfilled-placeholder report (advisory until launch)
# Stage 4 · Gate           everything above, green, on main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch is wasted CI minutes and a stale red X.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep npm quiet and non-interactive; funding/audit noise hides real failures.
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  # ── Stage 1 · Quality ──────────────────────────────────────────────────────
  quality:
    name: Stage 1 · Quality (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite runs the real migration against `node:sqlite`, which does
        # not exist before Node 22.5 — Node 20 is not a supported floor and a
        # matrix entry for it would be a permanently red job. `node:sqlite` is
        # still marked experimental, so BOTH supported majors are exercised on
        # main: an API change between 22 and 24 would silently break the only
        # tests that touch the real schema. PRs run 22 alone for speed.
        node: ${{ github.event_name == 'push' && fromJSON('["22","24"]') || fromJSON('["22"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint — Worker, app and shared)
        run: npm run lint

      - name: Tests (239 across 11 files)
        run: npm test

      # The stated test count has drifted four times (207/215/219/223), twice
      # while the DEPLOYED landing page served a number the suite no longer
      # matched. It is the easiest claim in the submission to falsify: clone,
      # npm test, compare. Every hand-fix decayed within days because the number
      # lives in six files with nothing connecting them.
      - name: Stated test count matches reality
        if: matrix.node == '22'
        run: node scripts/check-test-count.mjs

      - name: Coverage
        if: matrix.node == '22'
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Stage 1 · Types ────────────────────────────────────────────────────────
  # Two packages, two tsconfigs, two type universes: the Worker resolves
  # `@cloudflare/workers-types`, the app resolves React Native's. Neither can
  # typecheck the other's files, so they are a matrix rather than two steps —
  # a break in one still reports the other.
  typecheck:
    name: Stage 1 · Types (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: worker
            install: npm ci
          - package: app
            # Expo SDK 53 ships peer ranges that npm's strict resolver rejects;
            # this is the install the project has always used.
            install: npm ci --legacy-peer-deps
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.install }}

      - name: Typecheck (${{ matrix.package }})
        working-directory: ${{ matrix.package }}
        run: npx tsc --noEmit

      # Expo owns the versions of react-native AND of the community packages
      # around it — react-native-screens, -svg, -safe-area-context,
      # async-storage, typescript. Drift there does not fail typecheck and does
      # not fail the JS bundle; it fails native codegen, which only runs during
      # an actual Android build.
      #
      # On 2026-09-06 a grouped Dependabot PR bumped six of those, went green
      # through every gate here, merged, and then broke
      # `:react-native-screens:generateCodegenSchemaFromJavaScript` on the first
      # release build after it. `expo install --check` is the authority on which
      # versions the SDK expects, so it runs here rather than being remembered.
      - name: Expo SDK dependency alignment (app)
        if: matrix.package == 'app'
        working-directory: app
        run: npx expo install --check

      # The bundle gate. `tsc` walks the real filesystem and resolves anything
      # that is genuinely on disk; Metro has its own resolver rooted at `app/`
      # and refuses to reach above it. For weeks this repo typechecked green
      # while the app could not bundle at all — every `../../../shared/*.js`
      # import failed, which is the lake table, the fish table and the
      # reel-tension model, i.e. the game. It surfaced only when a release build
      # was attempted for the first time.
      #
      # A green typecheck is not evidence that the app builds. This step is.
      - name: Bundle (app — the gate tsc cannot be)
        if: matrix.package == 'app'
        working-directory: app
        env:
          EXPO_PUBLIC_ONESIGNAL_APP_ID: d0b804d5-37ea-4fac-bfea-60b8b765201e
        run: |
          npx expo export:embed \
            --platform android --dev false --entry-file index.js \
            --bundle-output /tmp/bundle.js --assets-dest /tmp/bundle-assets
          test -s /tmp/bundle.js
          # The shared modules must actually be IN the bundle, not merely
          # resolvable. A bundle that silently dropped them would still be a
          # file of non-zero size.
          grep -q 'Moonlight Koi' /tmp/bundle.js

  # ── Stage 2 · Determinism ──────────────────────────────────────────────────
  determinism:
    name: Stage 2 · Determinism & bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      # The content seed and the telemetry fixture are both deterministic. If
      # either regenerates to different bytes, a published rarity rate or the
      # documented bench output has silently changed.
      - name: Content seed is deterministic
        run: |
          npm run seed
          git diff --exit-code seed/content

      - name: Telemetry fixture is deterministic
        run: |
          npm run seed:anomalies
          git diff --exit-code seed/telemetry-anomalies.json

      # Asserts the exact documented counts, not merely exit 0.
      - name: Bench reproduces the documented fixture output
        run: |
          OUT=$(npm run --silent bench)
          echo "$OUT"
          echo "$OUT" | grep -q "VALIDATION DATA — NOT SUBMITTABLE"
          echo "$OUT" | grep -q "Answered within window:     17 / 39  (43.6%)"
          echo "$OUT" | grep -q "p50=9,000  p95=104,000  max=118,000   (n=23)"

      - name: Publish the bench block to the run summary
        run: |
          {
            echo '### Bench — fixture (validation data, not submittable)'
            echo '```'
            npm run --silent bench
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Stage 3 · Submission readiness (advisory) ──────────────────────────────
  # This job is EXPECTED to report unresolved items until the app is deployed
  # and published: the store URLs, the Worker URL, the D1 database id, the
  # RevenueCat/OneSignal dashboard ids and the real telemetry figures are all
  # genuinely unknown today. It is advisory so the pipeline reflects the state
  # of the CODE, and loud so the state of the SUBMISSION cannot be forgotten.
  # It must be green before the project is submitted.
  readiness:
    name: Stage 3 · Submission readiness (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Unfilled placeholders
        id: readiness
        continue-on-error: true
        run: |
          set +e
          OUT=$(node scripts/check-submission-readiness.mjs)
          CODE=$?
          echo "$OUT"
          {
            echo '### Submission readiness'
            if [ "$CODE" -eq 0 ]; then
              echo 'All placeholders resolved — safe to submit.'
            else
              echo '**Not submittable yet.** Every item below must become a real value first.'
            fi
            echo '```'
            echo "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

  # ── Stage 4 · Gate ─────────────────────────────────────────────────────────
  gate:
    name: Stage 4 · Gate
    needs: [quality, typecheck, determinism]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All gates passed
        run: |
          {
            echo '### CI gates'
            echo '- Quality — Prettier, ESLint, 239 tests on Node 22 and 24'
            echo '- Types — Worker and Expo app both typecheck clean'
            echo '- Determinism — content seed, telemetry fixture, exact bench output'
          } >> "$GITHUB_STEP_SUMMARY"
