name: pages

on:
  push:
    branches: ['main']
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# Landing page, privacy policy and pitch deck at https://lunker.edycu.dev — the files in
# site/ are committed (index.html + privacy.html via scripts/build-site.mjs, byte-checked by tests/landing.test.js).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
