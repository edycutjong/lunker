<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Lunker animated icon — a fishing hook draws itself into a midnight lake, ripples settle, then the bite: the amber notification dot pops, the hook twitches, ripples burst, and the lure glow breathes">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2F39"/>
      <stop offset="100%" stop-color="#03141B"/>
    </linearGradient>
    <linearGradient id="hookGrad" gradientUnits="userSpaceOnUse" x1="308" y1="170" x2="196" y2="286">
      <stop offset="0%" stop-color="#3FDBB6"/>
      <stop offset="52%" stop-color="#3FDBB6"/>
      <stop offset="100%" stop-color="#FFA05A"/>
    </linearGradient>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="300" y1="120" x2="118" y2="34">
      <stop offset="0%" stop-color="#3FDBB6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3FDBB6" stop-opacity="0.3"/>
    </linearGradient>
    <!-- Filled hook outline (same geometry as icon.svg) — a stroked path cannot
         produce a sharp point, so the draw-in can no longer be a stroke-dasharray
         on the hook itself. Instead the filled shape is revealed through a mask
         whose content IS a dashed stroke along the hook's centreline: same
         "draws itself in" read, but the delivered shape keeps its vertex. -->
    <path id="hookBody" d="
      M 311 164
      L 311 329
      A 63 63 0 0 1 185 329
      Q 186 296 196 268
      L 178 276
      L 206 246
      L 218 228
      Q 212 275 207 329
      A 41 41 0 0 0 289 329
      L 289 164
      Z
    "/>
    <mask id="drawIn" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <path d="M 300 164 L 300 329 A 52 52 0 0 1 196 329 Q 194 272 218 228"
            pathLength="100" style="stroke-dasharray:100"
            fill="none" stroke="#fff" stroke-width="62" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.03;0.2;1" dur="6s" repeatCount="indefinite"/>
      </path>
    </mask>
    <radialGradient id="tealGlow">
      <stop offset="0%" stop-color="#3FDBB6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#3FDBB6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow">
      <stop offset="0%" stop-color="#FFA05A" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFA05A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plateClip">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <style>
    .badge-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: badgePop 6s cubic-bezier(0.2, 1.4, 0.4, 1) infinite;
    }
    @keyframes badgePop {
      0%, 45%  { transform: scale(0.82); }
      48%      { transform: scale(1.3); }
      51%      { transform: scale(0.94); }
      54%      { transform: scale(1.06); }
      57%, 100% { transform: scale(1); }
    }
    .hook-twitch {
      transform-origin: 312px 128px;
      animation: hookTwitch 6s steps(2, jump-none) infinite;
    }
    @keyframes hookTwitch {
      0%, 46%   { transform: rotate(0deg); }
      47.5%     { transform: rotate(2.4deg); }
      49%       { transform: rotate(-2deg); }
      50.5%     { transform: rotate(1.3deg); }
      52%       { transform: rotate(-0.7deg); }
      53.5%, 100% { transform: rotate(0deg); }
    }
    .ripple-idle {
      animation: rippleIdle 6s ease-in-out infinite;
    }
    @keyframes rippleIdle {
      0%, 100% { opacity: 0.9; }
      36%      { opacity: 0.6; }
      70%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- ===== static base: midnight-lake plate (always visible) ===== -->
  <g clip-path="url(#plateClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#plate)"/>
    <circle cx="140" cy="432" r="250" fill="url(#tealGlow)"/>
    <circle cx="412" cy="76" r="200" fill="url(#amberGlow)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- ===== story layer (loop-fade wrapper) ===== -->
  <g>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.96;1" dur="6s" repeatCount="indefinite"/>

    <!-- ripples: fade in after the hook lands, idle breathe -->
    <g class="ripple-idle" fill="none" stroke="#3FDBB6">
      <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.24;0.3;1" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="304" cy="200" rx="44" ry="11" stroke-width="7" opacity="0.65"/>
      <ellipse cx="304" cy="200" rx="78" ry="20" stroke-width="5" opacity="0.3"/>
    </g>

    <!-- bite ripple bursts (sweep outward past the static ripples) -->
    <ellipse cx="304" cy="200" fill="none" stroke="#3FDBB6" stroke-width="5">
      <animate attributeName="rx" values="20;20;152;152" keyTimes="0;0.46;0.62;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="5;5;38;38" keyTimes="0;0.46;0.62;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.46;0.48;0.62;1" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="304" cy="200" fill="none" stroke="#FFA05A" stroke-width="3.5">
      <animate attributeName="rx" values="16;16;128;128" keyTimes="0;0.5;0.66;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="4;4;33;33" keyTimes="0;0.5;0.66;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.5;0.52;0.66;1" dur="6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- rising bubbles (inside the hook's opening, clear of the stroke) -->
    <circle cx="252" r="7" fill="#3FDBB6">
      <animate attributeName="cy" values="352;352;300;300" keyTimes="0;0.28;0.52;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.45;0;0" keyTimes="0;0.28;0.36;0.52;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="268" r="4.5" fill="#3FDBB6">
      <animate attributeName="cy" values="330;330;284;284" keyTimes="0;0.36;0.6;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.35;0;0" keyTimes="0;0.36;0.42;0.6;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- glow breath (blurred hook duplicate, wakes after the bite) -->
    <use href="#hookBody" fill="#3FDBB6" filter="url(#soft)" mask="url(#drawIn)">
      <animate attributeName="opacity" values="0;0;0.28;0.55;0.25;0.5;0.2;0.2" keyTimes="0;0.2;0.44;0.5;0.62;0.74;0.9;1" dur="6s" repeatCount="indefinite"/>
    </use>

    <!-- the hook: draws itself in, then twitches on the bite -->
    <g class="hook-twitch">
      <use href="#hookBody" fill="url(#hookGrad)" mask="url(#drawIn)"/>
      <!-- honed edge + tip glint, arriving once the point is drawn -->
      <g>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.19;0.23;1" dur="6s" repeatCount="indefinite"/>
        <path d="M 214 236 L 209 256" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="216.8" cy="230.5" r="2.8" fill="#FFFFFF" opacity="0.92"/>
      </g>
      <circle cx="300" cy="142" r="21" fill="none" stroke="url(#hookGrad)" stroke-width="17">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.1;1" dur="6s" repeatCount="indefinite"/>
      </circle>
      <!-- filament from badge to eye: draws just after the eye appears -->
      <path d="M 296 118 C 262 88, 190 58, 118 34" pathLength="100" style="stroke-dasharray:100" fill="none" stroke="url(#lineGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.08;0.2;1" dur="6s" repeatCount="indefinite"/>
      </path>
      <!-- amber flash rides the filament at the bite -->
      <path d="M 296 118 C 262 88, 190 58, 118 34" fill="none" stroke="#FFD9B0" stroke-width="5" stroke-linecap="round">
        <animate attributeName="opacity" values="0;0;0.9;0;0.7;0;0" keyTimes="0;0.455;0.47;0.49;0.51;0.55;1" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- bite notification badge: dim while waiting, pops on the bite -->
    <g class="badge-pop">
      <animate attributeName="opacity" values="0;0;0.35;0.35;1;1" keyTimes="0;0.1;0.14;0.45;0.48;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="398" cy="84" r="54" fill="url(#amberGlow)"/>
      <circle cx="398" cy="84" r="30" fill="#FFA05A"/>
      <circle cx="398" cy="84" r="30" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
      <circle cx="389" cy="74" r="7" fill="rgba(255,255,255,0.55)"/>
    </g>
  </g>
</svg>
