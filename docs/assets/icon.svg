<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lunker icon — a glowing fishing hook beneath ripples, with an amber bite notification dot">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2F39"/>
      <stop offset="100%" stop-color="#03141B"/>
    </linearGradient>
    <linearGradient id="hookGrad" gradientUnits="userSpaceOnUse" x1="320" y1="140" x2="196" y2="330">
      <stop offset="0%" stop-color="var(--primary, #3FDBB6)"/>
      <stop offset="58%" stop-color="var(--primary, #3FDBB6)"/>
      <stop offset="100%" stop-color="var(--accent, #FFA05A)"/>
    </linearGradient>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="394" y1="110" x2="314" y2="118">
      <stop offset="0%" stop-color="var(--accent, #FFA05A)"/>
      <stop offset="100%" stop-color="var(--primary, #3FDBB6)"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop offset="0%" stop-color="var(--primary, #3FDBB6)" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="var(--primary, #3FDBB6)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow">
      <stop offset="0%" stop-color="var(--accent, #FFA05A)" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="var(--accent, #FFA05A)" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plateClip">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- midnight-lake plate -->
  <g clip-path="url(#plateClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#plate)"/>
    <circle cx="140" cy="432" r="250" fill="url(#tealGlow)"/>
    <circle cx="412" cy="76" r="200" fill="url(#amberGlow)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- water ripples where the line enters the lake -->
  <g fill="none" stroke="var(--primary, #3FDBB6)">
    <ellipse cx="312" cy="196" rx="46" ry="12" stroke-width="7" opacity="0.65"/>
    <ellipse cx="312" cy="196" rx="84" ry="22" stroke-width="5" opacity="0.3"/>
  </g>

  <!-- rising bubbles (inside the hook's opening, clear of the stroke) -->
  <circle cx="252" cy="254" r="7" fill="var(--primary, #3FDBB6)" opacity="0.4"/>
  <circle cx="272" cy="286" r="4.5" fill="var(--primary, #3FDBB6)" opacity="0.3"/>

  <!-- hook glow (soft duplicate) -->
  <path d="M312 150 L312 300 A80 80 0 1 1 192 230.7" fill="none" stroke="var(--primary, #3FDBB6)" stroke-width="30" stroke-linecap="round" opacity="0.45" filter="url(#soft)"/>

  <!-- the hook -->
  <path d="M312 150 L312 300 A80 80 0 1 1 192 230.7" fill="none" stroke="url(#hookGrad)" stroke-width="30" stroke-linecap="round"/>
  <!-- barb -->
  <path d="M192 230.7 L217 252" fill="none" stroke="var(--accent, #FFA05A)" stroke-width="20" stroke-linecap="round"/>
  <!-- hook eye -->
  <circle cx="312" cy="128" r="16" fill="none" stroke="var(--primary, #3FDBB6)" stroke-width="13"/>

  <!-- filament from the bite badge down to the eye -->
  <path d="M394 110 C 374 136, 338 130, 316 114" fill="none" stroke="url(#lineGrad)" stroke-width="9" stroke-linecap="round" opacity="0.9"/>

  <!-- bite notification badge -->
  <circle cx="398" cy="84" r="54" fill="url(#amberGlow)"/>
  <circle cx="398" cy="84" r="30" fill="var(--accent, #FFA05A)"/>
  <circle cx="398" cy="84" r="30" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <circle cx="389" cy="74" r="7" fill="rgba(255,255,255,0.55)"/>
</svg>
