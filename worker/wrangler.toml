name = "lunker"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The bite dispatcher. Every 15 minutes it sends to whoever is due; the per-player
# cadence gate (one bite per hour, never outside the lake's hours) lives in
# src/lib/bite.ts, not in this schedule.
# Static assets: the landing page's images (/assets/…) and the pitch deck (/pitch/).
# A request that matches a file here is served without invoking the Worker, so
# public/ must never contain a path the Worker routes (/, /verify, /privacy,
# /health, the POST API). tests/landing.test.js enforces that. Anything that is
# not a file falls through to the Worker unchanged.
[assets]
directory = "./public"

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lunker"
database_id = "b8f88c5a-3e3a-4300-83bc-4f4bbf2e0d36"
migrations_dir = "migrations"

[vars]
REVENUECAT_PROJECT_ID = "proj694c4173"
ONESIGNAL_APP_ID = "d0b804d5-37ea-4fac-bfea-60b8b765201e"
DEV_CAST_ENABLED = "0"

# Secrets are set with `wrangler secret put` and never live in this file:
#   REVENUECAT_SECRET_KEY, REVENUECAT_WEBHOOK_SECRET,
#   ONESIGNAL_REST_API_KEY, ROLL_SERVER_SECRET
